args:
  - --kubelet-insecure-tls
replicas: 1
resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 200Mi
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
