name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Lint and test
        run: |
          make lint
          make test

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag k8s-ml-inference:ci app

  e2e:
    name: Kind end to end
    runs-on: ubuntu-latest
    needs: [lint, image]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create the cluster and smoke test it
        run: make up
      - name: Remove the cluster
        if: always()
        run: make down
