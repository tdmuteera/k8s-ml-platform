[project]
name = "inference"
version = "1.0.0"
description = "Small ML inference service for the local Kubernetes laboratory."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/inference/main.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
